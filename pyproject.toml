[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioicons-mcp"
version = "0.1.0"
description = "An MCP (Model Context Protocol) server for bioicons.com — a free library of high quality science illustrations."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bioicons-MCP Contributors"}
]
keywords = ["mcp", "bioicons", "icons", "science", "illustrations", "svg", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.0.0,<3.0.0",
    "httpx>=0.25.0",
    "anyio>=4.0.0",
    "uvicorn>=0.24.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
bioicons-mcp = "bioicons_mcp.server:main"

[project.urls]
Homepage = "https://bioicons.com"
Repository = "https://github.com/bioicons-mcp/bioicons-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioicons_mcp = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
